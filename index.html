<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcode PDF Tool</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Barcode PDF Tool</h1>
      <p>Upload shipping labels → detect tracking numbers → add barcodes → download PDF.</p>
    </div>
    <span class="badge">Browser Based</span>
  </header>

  <main>
    <section class="card">
      <div class="drop" id="dropZone">
        <input id="pdfInput" type="file" accept=".pdf,application/pdf">
        <button type="button" class="choose" id="chooseBtn">Choose PDF</button>
        <strong>Drop PDF here</strong>
        <span>or click “Choose PDF”</span>
        <small id="fileName">No file selected</small>
      </div>

      <div class="settings">
        <div><label>Left margin (mm)</label><input id="leftMargin" type="number" value="5" min="0" step="0.5"></div>
        <div><label>Right margin (mm)</label><input id="rightMargin" type="number" value="5" min="0" step="0.5"></div>
        <div><label>Barcode height (mm)</label><input id="barcodeHeight" type="number" value="20" min="5" step="1"></div>
        <div><label>Barcode text size (px)</label><input id="textSize" type="number" value="16" min="7" step="1"></div>
        <div><label>Bottom margin (mm)</label><input id="bottomMargin" type="number" value="8" min="0" step="0.5"></div>
        <div><label>QR code</label><select id="qrEnabled"><option value="yes" selected>Show QR + FOLLOW PLEASE</option><option value="no">Hide QR</option></select></div>
        <div><label>Barcode text</label><select id="showText"><option value="yes" selected>Show tracking number</option><option value="no">Hide tracking number</option></select></div>
      </div>

      <button id="processBtn" disabled>Process PDF</button>
      <div class="status" id="status">Select a PDF to begin.</div>
    </section>

    <section class="card result" id="resultCard" hidden>
      <h2>Processing Result</h2>
      <div id="results"></div>
      <div class="action-row">
        <button id="previewBtn" class="secondary">Preview PDF</button>
        <button id="printBtn">Print PDF</button>
        <button id="downloadBtn">Download PDF</button>
      </div>
      <iframe id="pdfPreview" title="Generated PDF preview"></iframe>
    </section>
  </main>

  <footer>PDF processing happens locally in your browser.</footer>
</div>

<!-- Classic scripts: works without ES-module/import problems -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bwip-js@4.5.1/dist/bwip-js-min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="js/app.js"></script>
</body>
</html>
